<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumio Prototypes</title>
<style>
  :root {
    --fg:          #1f2328;
    --fg-muted:    #59636e;
    --bg:          #ffffff;
    --bg-subtle:   #f6f8fa;
    --border:      #d1d9e0;
    --border-muted:#d1d9e0b3;
    --accent:      #0969da;
    --header-bg:   #f6f8fa;
    --label-fg:    #0969da;
    --label-bg:    #ddf4ff;
    --success:     #1f883d;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  svg { fill: currentColor; vertical-align: text-bottom; flex-shrink: 0; }

  /* Header */
  .app-header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    max-width: 1012px;
    margin: 0 auto;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
  }
  .logo {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  .crumb { color: var(--fg); font-weight: 600; }
  .crumb-sep { color: var(--fg-muted); }
  .count {
    padding: 0 6px;
    font-size: 12px;
    font-weight: 500;
    line-height: 18px;
    color: var(--fg);
    background: #818b981f;
    border-radius: 2em;
  }


  /* Layout */
  .container {
    max-width: 1012px;
    margin: 0 auto;
    padding: 24px 32px 48px;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .search {
    flex: 1;
    min-width: 0;
    padding: 5px 12px;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .search:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  /* Repo list */
  .repo-list { list-style: none; margin: 0; padding: 0; }
  .repo {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 0;
    border-bottom: 1px solid var(--border-muted);
  }
  .repo-title {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
  }
  .badge {
    padding: 0 7px;
    font-size: 12px;
    font-weight: 500;
    line-height: 18px;
    color: var(--fg-muted);
    border: 1px solid var(--border);
    border-radius: 2em;
  }
  .repo-desc {
    max-width: 75ch;
    margin: 0 0 8px;
    color: var(--fg-muted);
  }
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 8px;
  }
  .topic {
    padding: 0 10px;
    font-size: 12px;
    font-weight: 500;
    line-height: 22px;
    color: var(--label-fg);
    background: var(--label-bg);
    border-radius: 2em;
  }
  .topic:hover { background: var(--accent); color: #fff; text-decoration: none; }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--fg-muted);
  }
  .meta-item { display: inline-flex; align-items: center; gap: 4px; }
  .lang-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid #1f232826;
  }

  /* Password field, after GitHub's clone URL input group */
  .password {
    display: flex;
    width: 184px;
    margin-top: 8px;
    font-size: 12px;
  }
  .password-key {
    display: grid;
    place-items: center;
    padding: 0 8px;
    color: var(--fg-muted);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-right: 0;
    border-radius: 6px 0 0 6px;
  }
  .password-value {
    flex: 1;
    min-width: 0;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 20px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .password-value:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .copy {
    display: grid;
    place-items: center;
    padding: 0 8px;
    color: var(--fg-muted);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-left: 0;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
  }
  .copy:hover { color: var(--fg); background: #eff2f5; }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy .icon-check { display: none; }
  .copy.is-copied { color: var(--success); }
  .copy.is-copied .icon-copy { display: none; }
  .copy.is-copied .icon-check { display: block; }

  .repo-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 500;
    line-height: 20px;
    color: var(--fg);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
    white-space: nowrap;
  }
  .btn:hover { background: #eff2f5; text-decoration: none; }
  .btn svg { color: var(--fg-muted); }

  .empty {
    display: none;
    padding: 32px 0;
    text-align: center;
    color: var(--fg-muted);
  }

  /* Sign in */
  .signin {
    max-width: 340px;
    margin: 48px auto 32px;
    text-align: center;
  }
  .signin-icon { color: var(--fg-muted); }
  .signin-title {
    margin: 16px 0;
    font-size: 24px;
    font-weight: 300;
    letter-spacing: -0.5px;
  }
  .signin-box {
    padding: 16px;
    text-align: left;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .signin-box label {
    display: block;
    margin-bottom: 8px;
    font-weight: 400;
  }
  .signin-box input {
    width: 100%;
    margin-bottom: 16px;
    padding: 5px 12px;
    font: inherit;
    line-height: 20px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .signin-box input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .signin-error {
    margin: -8px 0 16px;
    font-size: 12px;
    color: #d1242f;
  }
  .btn-primary {
    width: 100%;
    padding: 5px 16px;
    font: inherit;
    font-weight: 500;
    line-height: 20px;
    color: #fff;
    background: var(--success);
    border: 1px solid #1f232826;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-primary:hover { background: #1c8139; }
  .btn-primary:disabled { opacity: 0.7; cursor: progress; }
  .btn-primary:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .lock { margin-left: auto; font-family: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  footer {
    padding: 24px 0 0;
    font-size: 12px;
    color: var(--fg-muted);
  }

  @media (max-width: 640px) {
    .header-top { padding: 16px; }
    .container { padding: 16px 16px 40px; }
    .repo { flex-direction: column; }
    .repo-actions { flex-direction: row; align-items: center; gap: 8px; }
    .repo-actions .password { margin-top: 0; }
  }

</style>
</head>

<script>
  const STORAGE_KEY = 'lumio-prototypes-key';
  const payload = JSON.parse(document.getElementById('payload').textContent);
  const form = document.getElementById('signin');
  const input = document.getElementById('password');
  const submit = document.getElementById('submit');
  const error = document.getElementById('error');
  const content = document.getElementById('content');
  const lock = document.getElementById('lock');

  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));

  async function deriveKey(password) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: fromB64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      true,
      ['decrypt']
    );
  }

  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(payload.iv) }, key, fromB64(payload.data));
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    form.hidden = true;
    content.innerHTML = html;
    content.hidden = false;
    lock.hidden = false;
    initSearch();
    initCopy();
  }

  function initCopy() {
    content.addEventListener('focusin', event => {
      if (event.target.matches('.password-value')) event.target.select();
    });
    content.addEventListener('click', async event => {
      const button = event.target.closest('.copy');
      if (!button) return;
      const field = button.parentElement.querySelector('.password-value');
      try {
        await navigator.clipboard.writeText(button.dataset.copy);
      } catch {
        field.select();
        document.execCommand('copy');
      }
      button.classList.add('is-copied');
      button.setAttribute('aria-label', 'Copied');
      setTimeout(() => {
        button.classList.remove('is-copied');
        button.setAttribute('aria-label', 'Copy password');
      }, 1500);
    });
  }

  function initSearch() {
    const search = document.getElementById('search');
    const repos = content.querySelectorAll('.repo');
    const empty = document.getElementById('empty');

    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      let shown = 0;
      repos.forEach(repo => {
        const text = (repo.dataset.search + ' ' + repo.textContent).toLowerCase();
        const match = !q || text.includes(q);
        repo.hidden = !match;
        if (match) shown++;
      });
      empty.style.display = shown ? 'none' : 'block';
    });
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const key = await deriveKey(input.value);
      const html = await decrypt(key);
      try {
        sessionStorage.setItem(STORAGE_KEY, toB64(await crypto.subtle.exportKey('raw', key)));
      } catch {}
      show(html);
    } catch {
      error.hidden = false;
      input.select();
    } finally {
      submit.disabled = false;
      submit.textContent = 'Sign in';
    }
  });

  lock.addEventListener('click', () => {
    try { sessionStorage.removeItem(STORAGE_KEY); } catch {}
    location.reload();
  });

  // Stay signed in for this browser tab
  (async () => {
    let saved = null;
    try { saved = sessionStorage.getItem(STORAGE_KEY); } catch {}
    if (!saved) return;
    try {
      const key = await crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt']);
      show(await decrypt(key));
    } catch {
      try { sessionStorage.removeItem(STORAGE_KEY); } catch {}
    }
  })();
</script>

</body>
</html>
