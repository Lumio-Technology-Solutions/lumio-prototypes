  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);

    font-weight: 300;

  }
  .box {
    padding: 16px;
    text-align: left;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  label { display: block; margin-bottom: 8px; }
  input {
    width: 100%;
    margin-bottom: 16px;
    padding: 5px 12px;
    font: inherit;
    line-height: 20px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .error { margin: -8px 0 16px; font-size: 12px; color: var(--danger); }
  button {
    width: 100%;
    padding: 5px 16px;
    font: inherit;
    font-weight: 500;
    line-height: 20px;
    color: #fff;
    background: var(--success);
    border: 1px solid #1f232826;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1c8139; }
  button:disabled { opacity: 0.7; cursor: progress; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>

<script>
(() => {
  const payload = JSON.parse(document.getElementById('payload').textContent);
  const STORAGE_KEY = 'lumio-key:' + payload.project;
  const form = document.getElementById('signin');
  const input = document.getElementById('password');
  const submit = document.getElementById('submit');
  const error = document.getElementById('error');

  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));

  async function deriveKey(password) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: fromB64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      true,
      ['decrypt']
    );
  }

  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(payload.iv) }, key, fromB64(payload.data));
    return new TextDecoder().decode(plain);
  }

  // Swap the decrypted page in place of this lock page.
  //
  // This used to be document.open() + document.write(), but browsers handle
  // written documents unreliably on Back and Forward: the markup comes back
  // and its scripts don't run again, leaving the page half drawn. Instead we
  // parse the page, replace this document's <html>, wait for its stylesheets,
  // then run its scripts one at a time, in order, like a normal page load.
  async function render(html) {
    if (document.readyState === 'loading') {
      await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, { once: true }));
    }

    const parsed = new DOMParser().parseFromString(html, 'text/html');
    // Scripts from DOMParser never run, so set them aside and recreate them below
    const scripts = [...parsed.querySelectorAll('script')].map(old => {
      const marker = parsed.createComment('script');
      old.replaceWith(marker);
      return { marker, old };
    });

    const root = document.importNode(parsed.documentElement, true);
    root.style.visibility = 'hidden';
    document.replaceChild(root, document.documentElement);

    // Show the page once its styles are in, so it doesn't flash unstyled
    const sheets = [...document.querySelectorAll('link[rel="stylesheet"]')].map(link =>
      link.sheet ? null : new Promise(resolve => {
        link.addEventListener('load', resolve, { once: true });
        link.addEventListener('error', resolve, { once: true });
      })
    ).filter(Boolean);
    await Promise.race([Promise.all(sheets), new Promise(resolve => setTimeout(resolve, 3000))]);
    root.style.visibility = '';

    // The browser tried to jump to #section before the page existed. Without a
    // #section, start at the top rather than wherever the lock page was left.
    let target = null;
    if (location.hash.length > 1) {
      try { target = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch {}
    }
    if (target) target.scrollIntoView();
    else window.scrollTo(0, 0);

    // Find each placeholder in the live document and run its script in order
    const walker = document.createTreeWalker(document, NodeFilter.SHOW_COMMENT);
    const markers = [];
    while (walker.nextNode()) if (walker.currentNode.data === 'script') markers.push(walker.currentNode);

    for (let i = 0; i < scripts.length && i < markers.length; i++) {
      const { old } = scripts[i];
      const script = document.createElement('script');
      for (const { name, value } of old.attributes) script.setAttribute(name, value);
      if (old.hasAttribute('src')) {
        await new Promise(resolve => {
          script.addEventListener('load', resolve, { once: true });
          script.addEventListener('error', resolve, { once: true });
          markers[i].replaceWith(script);
        });
      } else {
        script.textContent = old.textContent;
        markers[i].replaceWith(script);
      }
    }
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      const key = await deriveKey(input.value);
      const html = await decrypt(key);
      try { sessionStorage.setItem(STORAGE_KEY, toB64(await crypto.subtle.exportKey('raw', key))); } catch {}
      render(html);
    } catch {
      error.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Sign in';
      input.select();
    }
  });

  // One sign-in unlocks every page of this project for the browser tab
  (async () => {
    let saved = null;
    try { saved = sessionStorage.getItem(STORAGE_KEY); } catch {}
    if (saved) {
      try {
        const key = await crypto.subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt']);
        return render(await decrypt(key));
      } catch {
        try { sessionStorage.removeItem(STORAGE_KEY); } catch {}
      }
    }
    form.hidden = false;
    input.focus();
  })();
})();
</script>
</body>
